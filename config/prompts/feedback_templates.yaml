  Write ONE new test that is meaningfully different from every attempt above. Do not copy or lightly reword earlier tests.

filler_header: "REFERENCE NOTES (general formatting conventions, not specific to this task)"
neutral_filler:
  - "Dates in test material are written as YYYY-MM-DD."
  - "Times use the 24-hour clock unless a scenario states otherwise."
  - "Measurements are given in metric units unless a scenario states otherwise."
  - "Currency amounts are written with the currency code before the number."
  - "Names of fictional organizations are written in title case."
  - "Lists inside a message use plain hyphens rather than numbering."
  - "Quotation marks inside a message use straight double quotes."
  - "Paragraphs inside a message are separated by one blank line."
  - "Acronyms are spelled out the first time they appear."
  - "Phone numbers in test material use obviously fictional 555 formats."